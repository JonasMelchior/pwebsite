name: Release Native Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Native Binary in Container
        run: ./mvnw package -Dnative -Dquarkus.native.container-build=true -DskipTests

      - name: Prepare Binary Artifact
        run: |
          mv target/*-runner pwebsite-linux-amd64
          chmod +x pwebsite-linux-amd64

      - name: Upload Build Artifact (for master branch runs)
        uses: actions/upload-artifact@v4
        with:
          name: pwebsite-linux-amd64
          path: pwebsite-linux-amd64
          if-no-files-found: error

      - name: Create GitHub Release & Upload Binary (for tagged commits)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pwebsite-linux-amd64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
